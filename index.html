<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterhead Generator</title>
<style>
:root{--bg:#f4f1ea;--pn:#fff;--tx:#1c1c1a;--mu:#6b675e;--bd:#d9d4c7;--ac:#8a6a12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--pn:#211f1b;--tx:#eee9dc;--mu:#a29c8c;--bd:#3a362d;--ac:#d4b04a}}
:root[data-theme="dark"]{--bg:#161512;--pn:#211f1b;--tx:#eee9dc;--mu:#a29c8c;--bd:#3a362d;--ac:#d4b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
.panel{background:var(--pn);border-right:1px solid var(--bd);padding:16px;overflow:auto}
.panel h1{font-size:17px;margin:0 0 12px}
label{display:block;font-weight:600;font-size:12px;color:var(--mu);margin:0 0 10px}
input,textarea{width:100%;box-sizing:border-box;margin-top:4px;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,sans-serif}
textarea{resize:vertical}
.row{display:flex;gap:6px}.row input{flex:1}
button{margin-top:4px;padding:8px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:600 13px system-ui,sans-serif;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.hint,#msg{font-size:12px;color:var(--mu);margin:4px 0 8px}
.prev{overflow:auto;padding:18px 10px}
.page{position:relative;width:794px;height:1123px;background:#fff;margin:0 auto 18px;box-shadow:0 2px 14px #0003;overflow:hidden;font-family:"Times New Roman","Liberation Serif",Times,serif;color:#000}

const ord=n=>n+((n%100>10&&n%100<14)?'th':(['th','st','nd','rd'][n%10]||'th'));
const today=()=>{const d=new Date();return ord(d.getDate())+' '+d.toLocaleString('en-GB',{month:'long'})+', '+d.getFullYear()};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const IDS=['our','your','date','a1','a2','a3','ttl','body'];

IDS.forEach(k=>{$(k).value=saved[k]!==undefined?saved[k]:DEF[k]});
let c;const pages=$('pages');
function np(){const p=document.createElement('div');p.className='page';p.innerHTML='<div class="wm"></div><div class="hd"></div><div class="ln"></div><div class="c"></div><div class="ft"></div>';pages.appendChild(p);c=p.querySelector('.c')}
const fits=()=>c.scrollHeight<=c.clientHeight+1;
function add(el,txt){
  c.appendChild(el);if(fits())return;c.removeChild(el);
  if(txt==null){if(c.children.length)np();c.appendChild(el);return}
  let w=txt.split(/\s+/);
  while(w.length){
    const t=el.cloneNode();c.appendChild(t);
    const set=n=>{t.innerHTML=fmt(w.slice(0,n).join(' '))};
    let lo=0,hi=w.length;
    while(lo<hi){const m=Math.ceil((lo+hi)/2);set(m);if(fits())lo=m;else hi=m-1}
    if(lo==0){c.removeChild(t);if(c.children.length){np();continue}lo=1;c.appendChild(t)}
    set(lo);w=w.slice(lo);if(w.length)np();
  }
}
function mk(cls,txt,tag){const e=document.createElement(tag||'p');e.className=cls;e.innerHTML=fmt(txt);return e}
function build(){
  pages.style.zoom=1;pages.innerHTML='';np();
  const v=k=>$(k).value.trim();
  if(v('our')||v('your')){const r=document.createElement('div');r.className='d rf';r.innerHTML='<span>Our Ref: '+esc(v('our'))+'</span><span class="yr">Your Ref:<span class="bl">'+(esc(v('your'))||'&nbsp;')+'</span></span><span>'+esc(v('date'))+'</span>';add(r);let f=15.5;while(r.scrollWidth>r.clientWidth+1&&f>11){f-=.5;r.style.fontSize=f+'px'}}else if(v('date'))add(mk('d',v('date')));
  ['a1','a2','a3'].forEach(k=>{if(v(k))add(mk('ad',v(k)))});
  if(v('ttl'))add(mk('t',v('ttl')));

  const s=document.createElement('div');s.className='sg';

  add(s,null);fit();
}
function fit(){const z=Math.min(1,($('pages').parentElement.clientWidth-20)/794);pages.style.zoom=z}

    const dl=window.claude?await claude.use('downloads'):null;
    if(!dl){m.textContent='Saving is unavailable in this view. Use Print, then choose Save as PDF.'}
    else{const name=($('ttl').value||'letter').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'letter';await dl.save({filename:name+'.pdf',data:pdf.output('blob')});m.textContent=''}
  }catch(e){m.textContent=(e&&e.code==='declined')?'':'Could not create the PDF. Try Print, then Save as PDF.'}
  fit();
};
build();
</script></body></html>
